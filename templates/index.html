<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行手账 | Travel Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght=300;400;500;700&family=Shippori+Mincho:wght=400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --color-cream: #FDF8F3;
            --color-warm-white: #FFFEFA;
            --color-blush: #F5E6E0;
            --color-sage: #C5D5C5;
            --color-sage-dark: #A8B5A8;
            --color-terracotta: #D4A59A;
            --color-text: #5D5D5D;
            --color-text-light: #8A8A8A;
            --color-text-muted: #A9A9A9;
            --color-border: #E8E0D8;
            --color-shadow: rgba(139, 119, 101, 0.08);
            --font-display: 'Shippori Mincho', serif;
            --font-body: 'Noto Sans JP', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--color-cream);
            color: var(--color-text);
            line-height: 1.8;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 20%, rgba(197, 213, 197, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(245, 230, 224, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(212, 165, 154, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        /* 樱花装饰 */
        .cherry-blossom {
            position: fixed;
            background: rgba(245, 230, 224, 0.7);
            border-radius: 50% 0 50% 0;
            pointer-events: none;
            z-index: 0;
            animation: float 20s ease-in-out infinite;
        }

        /* 波浪装饰 */
        .wave-decoration {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: url('data:image/svg+xml,%3Csvg width="100%" height="40" viewBox="0 0 1000 40" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="M0,20 Q250,0 500,20 T1000,20 L1000,40 L0,40 Z" fill="%23F5E6E0" opacity="0.3"/%3E%3C/svg%3E') repeat-x;
            background-size: 1000px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* 日式几何装饰 */
        .japanese-pattern {
            position: fixed;
            width: 60px;
            height: 60px;
            opacity: 0.1;
            pointer-events: none;
            background: url('data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="M30,5 L35,15 L45,15 L35,25 L40,35 L30,30 L20,35 L25,25 L15,15 L25,15 Z" fill="%23D4A59A"/%3E%3C/svg%3E');
            z-index: 0;
        }

        /* 确保内容在装饰之上 */
        .container {
            position: relative;
            z-index: 1;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.7;
            }

            25% {
                transform: translateY(-10px) rotate(5deg);
                opacity: 0.5;
            }

            50% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 0.7;
            }

            75% {
                transform: translateY(-10px) rotate(-5deg);
                opacity: 0.5;
            }
        }

        .container {
            max-width: 100%;
            max-height: 100%;
            margin: 0 auto;
            padding: 24px 32px 48px;
        }

        /* 头部区域 */
        header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .header-decoration {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 18px;
            animation: fadeIn 0.8s ease-out;
        }

        .header-line {
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--color-terracotta), transparent);
        }

        .header-flower {
            width: 10px;
            height: 10px;
            background: var(--color-terracotta);
            border-radius: 50%;
            opacity: 0.6;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 3rem;
            font-weight: 500;
            color: var(--color-text);
            letter-spacing: 0.12em;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        /* 顶部用户栏 */
        .user-bar {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--color-warm-white);
            border: 1px solid rgba(232, 224, 216, 0.6);
            border-radius: 30px;
            padding: 6px 8px 6px 16px;
            box-shadow: 0 4px 16px var(--color-shadow);
            animation: fadeIn 0.8s ease-out;
        }

        .user-name {
            font-size: 0.82rem;
            color: var(--color-text);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            letter-spacing: 0.03em;
        }

        .user-name svg {
            width: 15px;
            height: 15px;
            stroke: var(--color-sage-dark);
            stroke-width: 1.5;
            fill: none;
        }

        .logout-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 14px;
            border: none;
            border-radius: 20px;
            background: var(--color-cream);
            color: var(--color-text-light);
            cursor: pointer;
            font-size: 0.78rem;
            font-family: var(--font-body);
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background: var(--color-blush);
            color: var(--color-terracotta);
        }

        .logout-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 1.6;
            fill: none;
        }

        @media (max-width: 600px) {
            .user-bar {
                top: 12px;
                right: 12px;
                padding: 5px 6px 5px 12px;
            }
        }

        /* 主布局区域 */
        .main-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            min-height: calc(100vh - 120px);
            max-width: 1600px;
            margin: 0 auto;
        }

        /* 左侧栏 */
        .left-sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 卡片通用样式 */
        .card {
            background: var(--color-warm-white);
            border-radius: 20px;
            padding: 24px;
            box-shadow:
                0 4px 20px var(--color-shadow),
                0 1px 2px rgba(255, 255, 255, 0.8) inset;
            border: 1px solid rgba(232, 224, 216, 0.5);
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out 0.4s both;
            position: relative;
        }

        /* 卡片装饰 - 日式和纸纹理 */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(45deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0) 100%),
                url('data:image/svg+xml,%3Csvg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z" fill="%23C5D5C5" fill-opacity="0.05" fill-rule="evenodd"/%3E%3C/svg%3E');
            pointer-events: none;
            border-radius: 20px;
        }

        /* 卡片顶部樱花装饰 */
        .card::after {
            content: '';
            position: absolute;
            top: -20px;
            right: -20px;
            width: 100px;
            height: 100px;
            background: url('data:image/svg+xml,%3Csvg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="M50,10 C60,20 70,25 80,40 C85,50 85,60 80,70 C70,85 60,90 50,90 C40,90 30,85 20,70 C15,60 15,50 20,40 C30,25 40,20 50,10 Z M50,20 C55,25 60,30 65,35 C70,40 70,45 65,50 C60,55 55,60 50,60 C45,60 40,55 35,50 C30,45 30,40 35,35 C40,30 45,25 50,20 Z" fill="%23F5E6E0" fill-opacity="0.15"/%3E%3C/svg%3E');
            pointer-events: none;
            z-index: 0;
        }

        /* 卡片角落装饰 */
        .card-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            background: url('data:image/svg+xml,%3Csvg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="M0,0 L20,0 L20,20 L0,20 Z M5,5 L15,5 L15,15 L5,15 Z" fill="none" stroke="%23D4A59A" stroke-width="1" stroke-opacity="0.2"/%3E%3C/svg%3E');
            pointer-events: none;
            z-index: 1;
        }

        .card-corner.top-left {
            top: 8px;
            left: 8px;
        }

        .card-corner.top-right {
            top: 8px;
            right: 8px;
            transform: rotate(90deg);
        }

        .card-corner.bottom-left {
            bottom: 8px;
            left: 8px;
            transform: rotate(270deg);
        }

        .card-corner.bottom-right {
            bottom: 8px;
            right: 8px;
            transform: rotate(180deg);
        }

        /* 卡片内容容器 */
        .card-content {
            position: relative;
            z-index: 1;
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 500;
            color: var(--color-text);
            margin-top: -28px;
            letter-spacing: 0.08em;
            opacity: 0.85;
        }

        /* 日历样式 - 高度缩小 + 标题对齐 + 紧凑间距 */
        .calendar-card {
            flex: 0 0 auto;
            height: 330px;
            min-width: 300px;
            padding-bottom: 12px;
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            gap: 12px;
        }

        .calendar-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .calendar-nav {
            display: flex;
            gap: 4px;
        }

        .calendar-nav button {
            width: 24px;
            height: 24px;
            border: none;
            background: none;
            cursor: pointer;
            color: var(--color-sage-dark);
            font-size: 13px;
            border-radius: 50%;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calendar-nav button:hover {
            background: rgba(197, 213, 197, 0.3);
        }

        .calendar-month-year {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--color-text);
        }

        /* 核心：缩小日历网格间距 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .calendar-weekday {
            font-size: 0.7rem;
            color: var(--color-text-muted);
            padding: 2px 0;
            font-weight: 400;
        }

        .calendar-day {
            aspect-ratio: 1.3/1;

            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.25s ease;
            color: var(--color-text);
            position: relative;
        }

        .calendar-day:hover {
            background: rgba(197, 213, 197, 0.35);
        }

        .calendar-day.today {
            background: var(--color-sage);
            color: white;
            font-weight: 500;
        }

        .calendar-day.has-journal {
            background: var(--color-blush);
            color: var(--color-text);
            font-weight: 500;
        }

        .calendar-day.has-journal.today {
            background: var(--color-terracotta);
            color: white;
        }

        .calendar-day.has-journal::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 3px;
            background: var(--color-terracotta);
            border-radius: 50%;
        }

        .calendar-day.has-journal.today::after {
            background: white;
        }

        .calendar-day.other-month {
            color: var(--color-text-muted);
            opacity: 0.4;
        }

        /* 地图样式 - 高度增大 + 完整轮廓 */
        .map-card {
            flex: 1;
            min-height: 350px;
            padding: 0;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .map-header {
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .map-header .card-title {
            margin-top: -20px;
        }

        .map-container {
            flex: 1;
            width: 100%;
            border-radius: 0 0 20px 20px;
            position: relative;
            overflow: hidden;
            background: var(--color-warm-white);
            padding: 0 20px 20px;
        }

        .china-map {
            width: 100%;
            height: 100%;
        }

        /* 统一风格的中国地图 */
        .china-map path {
            fill: var(--color-sage);
            stroke: var(--color-warm-white);
            stroke-width: 1;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .china-map path:hover {
            fill: var(--color-terracotta);
        }

        .china-map path.visited {
            fill: var(--color-terracotta);
        }

        .map-tooltip {
            position: absolute;
            background: rgba(255, 254, 250, 0.95);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.75rem;
            color: var(--color-text);
            box-shadow: 0 2px 8px var(--color-shadow);
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .map-tooltip.show {
            opacity: 1;
        }

        /* 上传按钮 */
        .upload-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--color-warm-white);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
            color: var(--color-text);
            box-shadow: 0 2px 8px var(--color-shadow);
        }

        .upload-btn:hover {
            border-color: var(--color-sage);
            background: linear-gradient(135deg, rgba(197, 213, 197, 0.08) 0%, rgba(255, 254, 250, 0.5) 100%);
            transform: translateY(-1px);
        }

        .upload-btn svg {
            width: 18px;
            height: 18px;
            stroke: var(--color-sage-dark);
            stroke-width: 1.5;
            fill: none;
        }

        #fileInput {
            display: none;
        }

        /* 右侧手账列表 */
        .journal-scroll {
            background: var(--color-warm-white);
            border-radius: 20px;
            padding: 28px;
            box-shadow:
                0 4px 20px var(--color-shadow),
                0 1px 2px rgba(255, 255, 255, 0.8) inset;
            border: 1px solid rgba(232, 224, 216, 0.5);
            height: calc(100vh - 100px);
            overflow-y: auto;
            animation: fadeInUp 0.8s ease-out 0.6s both;
            position: relative;
        }

        /* 手账区域装饰 - 日式和纸纹理 */
        .journal-scroll::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(45deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0) 100%),
                url('data:image/svg+xml,%3Csvg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z" fill="%23C5D5C5" fill-opacity="0.05" fill-rule="evenodd"/%3E%3C/svg%3E');
            pointer-events: none;
            border-radius: 20px;
        }

        /* 手账区域顶部樱花装饰 */
        .journal-scroll::after {
            content: '';
            position: absolute;
            top: -20px;
            right: -20px;
            width: 100px;
            height: 100px;
            background: url('data:image/svg+xml,%3Csvg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="M50,10 C60,20 70,25 80,40 C85,50 85,60 80,70 C70,85 60,90 50,90 C40,90 30,85 20,70 C15,60 15,50 20,40 C30,25 40,20 50,10 Z M50,20 C55,25 60,30 65,35 C70,40 70,45 65,50 C60,55 55,60 50,60 C45,60 40,55 35,50 C30,45 30,40 35,35 C40,30 45,25 50,20 Z" fill="%23F5E6E0" fill-opacity="0.15"/%3E%3C/svg%3E');
            pointer-events: none;
            z-index: 0;
        }

        .journal-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .journal-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .journal-scroll::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: 4px;
        }

        .journal-scroll.active {
            border-color: var(--color-sage);
            background: linear-gradient(135deg, rgba(197, 213, 197, 0.08) 0%, rgba(255, 254, 250, 0.95) 100%);
        }

        .scroll-title {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 500;
            color: var(--color-text);
            margin-bottom: 24px;
            letter-spacing: 0.08em;
            opacity: 0.85;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .journal-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .journal-card {
            background: linear-gradient(135deg, rgba(253, 248, 243, 0.7) 0%, rgba(255, 254, 250, 0.7) 100%);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--color-border);
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease-out both;
        }

        .journal-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px var(--color-shadow);
        }

        .journal-cover {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }

        .journal-cover-wrap {
            position: relative;
        }

        .journal-count-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(253, 248, 243, 0.88);
            color: var(--color-text);
            font-size: 0.72rem;
            padding: 2px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 8px var(--color-shadow);
            letter-spacing: 0.03em;
        }

        .journal-info {
            padding: 16px 18px;
        }

        .journal-date {
            font-size: 0.8rem;
            color: var(--color-terracotta);
            margin-bottom: 6px;
            font-weight: 500;
            letter-spacing: 0.04em;
        }

        .journal-location {
            font-size: 0.8rem;
            color: var(--color-text-light);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .journal-location svg {
            width: 13px;
            height: 13px;
            stroke: var(--color-sage-dark);
            stroke-width: 1.5;
            fill: none;
            flex-shrink: 0;
        }

        .journal-preview {
            font-size: 0.83rem;
            color: var(--color-text);
            line-height: 1.7;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-text-muted);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: var(--color-border);
            stroke-width: 1.2;
            fill: none;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-state p {
            font-size: 0.85rem;
            line-height: 1.8;
        }

        /* 加载状态 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(253, 248, 243, 0.9);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            flex-direction: column;
            gap: 20px;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-spinner {
            width: 44px;
            height: 44px;
            position: relative;
        }

        .loading-spinner::before,
        .loading-spinner::after {
            content: '';
            position: absolute;
            border-radius: 50%;
        }

        .loading-spinner::before {
            inset: 0;
            border: 2px solid var(--color-border);
        }

        .loading-spinner::after {
            inset: 0;
            border: 2px solid transparent;
            border-top-color: var(--color-terracotta);
            animation: spin 0.8s linear infinite;
        }

        .loading-overlay p {
            font-size: 0.92rem;
            color: var(--color-text-light);
            letter-spacing: 0.04em;
        }

        /* 动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .main-layout {
                grid-template-columns: 280px 1fr;
                gap: 24px;
                max-width: 1300px;
            }

            .container {
                padding: 20px 20px 40px;
            }
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .left-sidebar {
                flex-direction: row;
            }

            .left-sidebar>* {
                flex: 1;
                min-height: auto;
            }

            .journal-scroll {
                height: 500px;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }

            .container {
                padding: 16px 14px 32px;
            }

            .left-sidebar {
                flex-direction: column;
            }

            .card {
                padding: 18px;
            }

            .journal-scroll {
                padding: 20px;
            }

            .journal-cover {
                height: 130px;
            }
        }

        /* 手账弹窗样式 */
        .journal-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-content {
            background: var(--color-warm-white);
            border-radius: 20px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(232, 224, 216, 0.5);
            animation: fadeInUp 0.3s ease-out;
        }

        .modal-header {
            padding: 24px 28px;
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--color-text);
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--color-text-muted);
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: var(--color-blush);
            color: var(--color-text);
        }

        .modal-body {
            padding: 28px;
        }

        .modal-image {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .modal-gallery {
            margin-bottom: 20px;
        }

        .modal-gallery .modal-image {
            margin-bottom: 10px;
        }

        .modal-thumbs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .modal-thumb {
            width: 72px;
            height: 56px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            flex-shrink: 0;
            opacity: 0.75;
        }

        .modal-thumb:hover {
            opacity: 1;
        }

        .modal-thumb.active {
            border-color: var(--color-sage-dark);
            opacity: 1;
        }

        .modal-info {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .modal-date,
        .modal-location {
            font-size: 0.9rem;
            color: var(--color-text-light);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .modal-date {
            color: var(--color-terracotta);
            font-weight: 500;
        }

        .modal-location svg {
            width: 16px;
            height: 16px;
            stroke: var(--color-sage-dark);
            stroke-width: 1.5;
            fill: none;
        }

        .modal-journal {
            font-size: 1rem;
            line-height: 1.8;
            color: var(--color-text);
        }

        /* 编辑表单样式 */
        .editable-field {
            border-radius: 6px;
            outline: none;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

        .editable-field.editing {
            background: rgba(197, 213, 197, 0.12);
            box-shadow: 0 0 0 2px rgba(197, 213, 197, 0.6);
            cursor: text;
            padding: 2px 6px;
            margin: -2px -6px;
        }

        .editable-field.editing:hover {
            background: rgba(197, 213, 197, 0.18);
        }

        /* 减少动画偏好 */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ===== 搜索面板 ===== */
        .search-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .search-panel input {
            flex: 1;
            min-width: 110px;
            padding: 9px 12px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 0.8rem;
            color: var(--color-text);
            background: var(--color-cream);
            outline: none;
            transition: all 0.2s ease;
        }

        .search-panel input:focus {
            border-color: var(--color-sage);
            background: var(--color-warm-white);
        }

        .search-panel input::placeholder {
            color: var(--color-text-muted);
        }

        /* ===== 自定义月份选择器 ===== */
        .month-picker {
            position: relative;
            flex: 0 0 auto;
        }

        .month-picker input[type="hidden"] {
            display: none;
        }

        .month-picker-trigger {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            width: 150px;
            padding: 9px 12px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            background: var(--color-cream);
            color: var(--color-text);
            font-family: var(--font-body);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .month-picker-trigger:hover {
            border-color: var(--color-sage);
        }

        .month-picker-trigger.open {
            border-color: var(--color-sage);
            background: var(--color-warm-white);
        }

        .month-picker-trigger svg {
            width: 15px;
            height: 15px;
            fill: none;
            stroke: var(--color-sage-dark);
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .month-picker-trigger span {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .month-picker-trigger .month-picker-caret {
            margin-left: auto;
            transition: transform 0.2s ease;
        }

        .month-picker-trigger.open .month-picker-caret {
            transform: rotate(180deg);
        }

        .month-picker-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            z-index: 50;
            width: 228px;
            padding: 12px;
            background: var(--color-warm-white);
            border: 1px solid var(--color-border);
            border-radius: 14px;
            box-shadow: 0 12px 32px var(--color-shadow);
            display: none;
        }

        .month-picker-dropdown.open {
            display: block;
        }

        .month-picker-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .month-picker-nav {
            width: 26px;
            height: 26px;
            border: none;
            background: none;
            color: var(--color-sage-dark);
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .month-picker-nav:hover {
            background: rgba(197, 213, 197, 0.3);
        }

        .month-picker-year {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--color-text);
        }

        .month-picker-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .month-picker-month {
            padding: 8px 0;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--color-text);
            font-family: var(--font-body);
            font-size: 0.78rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .month-picker-month:hover {
            background: rgba(197, 213, 197, 0.3);
        }

        .month-picker-month.selected {
            background: var(--color-sage);
            color: #fff;
            font-weight: 500;
        }

        .month-picker-clear {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 7px 0;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--color-text-light);
            font-family: var(--font-body);
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .month-picker-clear:hover {
            color: var(--color-terracotta);
            background: rgba(245, 230, 224, 0.4);
        }

        .search-panel .search-clear {
            padding: 9px 14px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            background: var(--color-warm-white);
            color: var(--color-text-light);
            cursor: pointer;
            font-size: 0.8rem;
            font-family: var(--font-body);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .search-panel .search-clear:hover {
            border-color: var(--color-terracotta);
            color: var(--color-terracotta);
        }

        /* ===== 上传个性化设置弹窗 ===== */
        .upload-form .form-group {
            margin-bottom: 16px;
        }

        .upload-form label {
            display: block;
            font-size: 0.78rem;
            color: var(--color-text-light);
            margin-bottom: 6px;
            letter-spacing: 0.03em;
        }

        .upload-form input,
        .upload-form textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 0.85rem;
            color: var(--color-text);
            background: var(--color-cream);
            outline: none;
            transition: all 0.2s ease;
        }

        .upload-form input:focus,
        .upload-form textarea:focus {
            border-color: var(--color-sage);
            background: var(--color-warm-white);
        }

        .upload-form textarea {
            min-height: 80px;
            resize: vertical;
        }

        .upload-form .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .upload-form .btn-ghost {
            padding: 10px 20px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            background: var(--color-warm-white);
            color: var(--color-text);
            cursor: pointer;
            font-size: 0.85rem;
            font-family: var(--font-body);
            transition: all 0.2s ease;
        }

        .upload-form .btn-ghost:hover {
            border-color: var(--color-sage-dark);
        }

        .upload-form .btn-primary {
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: linear-gradient(135deg, var(--color-sage), var(--color-sage-dark));
            color: white;
            font-size: 0.85rem;
            font-family: var(--font-body);
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(197, 213, 197, 0.45);
            transition: all 0.2s ease;
        }

        .upload-form .btn-primary:hover {
            transform: translateY(-1px);
        }

        /* ===== 手账详情扩展字段 ===== */
        .modal-meta-extra {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 4px 0 16px;
        }

        .meta-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--color-cream);
            border: 1px solid var(--color-border);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.8rem;
        }

        .meta-chip .chip-label {
            color: var(--color-text-muted);
            flex-shrink: 0;
        }

        .meta-chip .chip-value {
            color: var(--color-text);
            min-width: 10px;
        }

        .meta-chip .chip-value.empty {
            color: var(--color-text-muted);
        }

        /* ===== 标签选择（chips）===== */
        .chip-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag-chip {
            padding: 5px 14px;
            border: 1px solid var(--color-border);
            border-radius: 20px;
            background: var(--color-cream);
            color: var(--color-text);
            cursor: pointer;
            font-size: 0.78rem;
            font-family: var(--font-body);
            transition: all 0.2s ease;
            user-select: none;
            line-height: 1.4;
        }

        .tag-chip:hover {
            border-color: var(--color-sage-dark);
        }

        .tag-chip.selected {
            background: linear-gradient(135deg, var(--color-sage), var(--color-sage-dark));
            color: white;
            border-color: transparent;
        }

        .chip-group.chip-readonly .tag-chip {
            cursor: default;
            pointer-events: none;
            opacity: 0.95;
        }

        /* 详情页扩展字段行 */
        .meta-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .meta-row>.chip-label {
            color: var(--color-text-muted);
            font-size: 0.78rem;
            flex-shrink: 0;
        }

        .meta-row>.chip-value {
            color: var(--color-text);
            font-size: 0.78rem;
            min-width: 10px;
        }

        .meta-row>.chip-value.empty {
            color: var(--color-text-muted);
        }

        /* 编辑时同行人输入框宽度 */
        .meta-row>.chip-value.editing {
            flex: 0 0 50px;
            width: 50px;
        }

        .chip-slot {
            display: contents;
        }

        .chip-empty {
            color: var(--color-text-muted);
            font-size: 0.78rem;
        }

        .custom-tag-input {
            padding: 5px 12px;
            border: 1px dashed var(--color-sage-dark);
            border-radius: 20px;
            font-family: var(--font-body);
            font-size: 0.78rem;
            color: var(--color-text);
            background: var(--color-warm-white);
            outline: none;
            min-width: 80px;
            line-height: 1.4;
        }

        .custom-tag-input:focus {
            border-style: solid;
            border-color: var(--color-sage-dark);
        }

        /* 同行人输入框加长 */
        .upload-form input#companionInput {
            min-height: 46px;
        }

        .modal-export {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .export-btn {
            padding: 8px 16px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            background: var(--color-warm-white);
            color: var(--color-text);
            cursor: pointer;
            font-size: 0.8rem;
            font-family: var(--font-body);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .export-btn:hover {
            border-color: var(--color-sage-dark);
            background: linear-gradient(135deg, rgba(197, 213, 197, 0.08), rgba(255, 254, 250, 0.5));
        }

        .export-btn svg {
            width: 15px;
            height: 15px;
            stroke: var(--color-sage-dark);
            stroke-width: 1.5;
            fill: none;
        }
    </style>
</head>

<body>
    <!-- 顶部用户栏 -->
    <div class="user-bar" id="userBar" style="display: none;">
        <span class="user-name" id="userName">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span id="userNameText">用户</span>
        </span>
        <button class="logout-btn" id="logoutBtn" title="退出登录">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            退出
        </button>
    </div>

    <div class="container">
        <!-- 装饰元素 -->
        <div class="wave-decoration"></div>
        <div class="japanese-pattern" style="top: 10%; left: 5%; transform: rotate(15deg);"></div>
        <div class="japanese-pattern" style="top: 30%; right: 8%; transform: rotate(-10deg);"></div>
        <div class="japanese-pattern" style="bottom: 20%; left: 12%; transform: rotate(25deg);"></div>
        <div class="japanese-pattern" style="bottom: 40%; right: 15%; transform: rotate(-20deg);"></div>

        <header>
            <div class="header-decoration">
                <span class="header-line"></span>
                <span class="header-flower"></span>
                <span class="header-line"></span>
            </div>
            <h1>旅行手账</h1>
        </header>

        <div class="main-layout">
            <!-- 左侧栏：日历 + 地图 -->
            <aside class="left-sidebar">
                <!-- 日历 -->
                <div class="card calendar-card">
                    <!-- 角落装饰 -->
                    <div class="card-corner top-left"></div>
                    <div class="card-corner top-right"></div>
                    <div class="card-corner bottom-left"></div>
                    <div class="card-corner bottom-right"></div>

                    <div class="card-content">
                        <div class="calendar-header">
                            <h3 class="card-title">Calendar</h3>
                            <div class="calendar-controls">
                                <div class="calendar-nav left">
                                    <button id="prevMonth" aria-label="上个月">&lt;</button>
                                </div>
                                <span class="calendar-month-year" id="monthYearLabel"></span>
                                <div class="calendar-nav right">
                                    <button id="nextMonth" aria-label="下个月">&gt;</button>
                                </div>
                            </div>
                        </div>
                        <div class="calendar-grid" id="calendarGrid"></div>
                    </div>
                </div>

                <!-- 地图 -->
                <div class="card map-card">
                    <!-- 角落装饰 -->
                    <div class="card-corner top-left"></div>
                    <div class="card-corner top-right"></div>
                    <div class="card-corner bottom-left"></div>
                    <div class="card-corner bottom-right"></div>

                    <div class="card-content">
                        <div class="map-header">
                            <h3 class="card-title">Map</h3>
                        </div>
                        <div class="map-container" id="mapContainer">
                            <object class="china-map" id="chinaMap" data="/static/china-map.svg"
                                type="image/svg+xml"></object>

            <!-- 右侧栏：手账滚动列表 -->
            <section class="journal-scroll">
                <!-- 角落装饰 -->
                <div class="card-corner top-left"></div>
                <div class="card-corner top-right"></div>
                <div class="card-corner bottom-left"></div>
                <div class="card-corner bottom-right"></div>

                <div class="card-content">
                    <div class="scroll-title">
                        <span>Journal</span>
                        <button class="upload-btn" id="uploadBtn" role="button" tabindex="0" aria-label="上传照片">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 15V3m0 0l-4 4m4-4l4 4M3 15v4a2 2 0 002 2h14a2 2 0 002-2v-4" />

                            Upload
                            <input type="file" id="fileInput" accept="image/*" multiple>

                    <div class="search-panel" id="searchPanel">
                        <input type="text" id="searchKeyword" placeholder="搜索标题/正文关键词...">
                        <input type="text" id="searchLocation" placeholder="地点">
                        <input type="text" id="searchMood" placeholder="心情">
                        <input type="text" id="searchTag" placeholder="标签">
                        <div class="month-picker" id="monthPicker">
                            <button type="button" class="month-picker-trigger" id="monthPickerTrigger" title="按月份筛选">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <rect x="3" y="4" width="18" height="17" rx="2"></rect>
                                    <line x1="3" y1="9" x2="21" y2="9"></line>
                                    <line x1="8" y1="2" x2="8" y2="6"></line>

                                </svg>

                                        aria-label="上一年">‹</button>

                                    <button type="button" class="month-picker-nav" id="monthPickerNextYear"
                                        aria-label="下一年">›</button>

                                <line x1="14" y1="31" x2="26" y2="31" />

    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <p>正在生成你的专属手账...</p>
    </div>

    <!-- 上传个性化设置弹窗 -->
    <div class="journal-modal" id="uploadModal" style="display: none;">
        <div class="modal-content" style="max-width: 560px;">
            <div class="modal-header">
                <h3>个性化设置（可选）</h3>
                <button class="modal-close" id="uploadModalClose">&times;</button>
            </div>
            <div class="modal-body upload-form">
                <div class="selected-count" id="selectedCount" style="margin-bottom: 16px; padding: 8px 14px; background: rgba(197, 213, 197, 0.16); border-radius: 8px; font-size: 0.8rem; color: var(--color-sage-dark); letter-spacing: 0.03em;">已选择 1 张照片</div>
                <div class="form-group">
                    <label>心情（单选）</label>
                    <div id="moodGroup"></div>
                </div>
                <div class="form-group">
                    <label>天气（单选）</label>
                    <div id="weatherGroup"></div>
                </div>
                <div class="form-group">
                    <label>同行人</label>
                    <input type="text" id="companionInput" list="companionOptions" placeholder="如：朋友、家人、恋人...">
                    <datalist id="companionOptions">
                        <option value="独自"></option>
                        <option value="朋友"></option>
                        <option value="家人"></option>
                        <option value="恋人"></option>
                        <option value="同学"></option>
                        <option value="同事"></option>
                        <option value="伴侣"></option>
                        <option value="亲子"></option>
                    </datalist>
                </div>
                <div class="form-group">
                    <label>标签（可多选）</label>
                    <div id="tagsGroup"></div>
                </div>
                <div class="form-group">
                    <label>自定义提示词（补充你的要求）</label>
                    <textarea id="customPromptInput" placeholder="如：文案要活泼一点，突出海边氛围，多提和朋友的互动..."></textarea>
                </div>
                <div class="form-actions">
                    <button class="btn-ghost" id="skipGenerateBtn">直接生成</button>
                    <button class="btn-primary" id="confirmGenerateBtn">生成手账</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== 日历功能 =====
        const calendarGrid = document.getElementById('calendarGrid');
        const monthYearLabel = document.getElementById('monthYearLabel');
        let currentDate = new Date();
        let journalDates = new Set();

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthYearLabel.textContent = `${year}年${month + 1}月`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            let html = weekdays.map(d => `<div class="calendar-weekday">${d}</div>`).join('');

            for (let i = firstDay - 1; i >= 0; i--) {
                html += `<div class="calendar-day other-month">${daysInPrevMonth - i}</div>`;
            }

            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
                const hasJournal = journalDates.has(dateStr);

                let classes = 'calendar-day';
                if (isToday) classes += ' today';
                if (hasJournal) classes += ' has-journal';

                html += `<div class="${classes}" data-date="${dateStr}">${day}</div>`;
            }

            const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
            const remaining = totalCells - (firstDay + daysInMonth);
            for (let i = 1; i <= remaining; i++) {
                html += `<div class="calendar-day other-month">${i}</div>`;
            }

            calendarGrid.innerHTML = html;
        }

        document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        renderCalendar();

        // ===== 上传功能 =====
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');

        uploadBtn.addEventListener('click', (e) => {
            if (e.target !== fileInput) {
                fileInput.click();
            }
        });

        uploadBtn.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                fileInput.click();
            }
        });

        fileInput.addEventListener('change', function (e) {
            if (this.files.length) handleFiles(this.files);
        });

        const journalScroll = document.querySelector('.journal-scroll');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            journalScroll.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            journalScroll.addEventListener(eventName, () => journalScroll.classList.add('active'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            journalScroll.addEventListener(eventName, () => journalScroll.classList.remove('active'), false);
        });

        journalScroll.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const files = e.dataTransfer.files;
            if (files.length > 0) handleFiles(files);
        }

        let pendingFiles = [];

        const MAX_IMAGES = 9;
        const MAX_SIZE = 16 * 1024 * 1024;         // 单张上限
        const MAX_TOTAL_SIZE = 40 * 1024 * 1024;    // 总大小上限

        function handleFiles(fileList) {
            const files = Array.from(fileList || []);
            if (!files.length) return;

            if (files.length > MAX_IMAGES) {
                alert(`最多一次上传 ${MAX_IMAGES} 张图片`);
                fileInput.value = '';
                return;
            }
            for (const f of files) {
                if (f.size > MAX_SIZE) {
                    alert('单张图片大小不能超过 16MB');
                    fileInput.value = '';
                    return;
                }
            }
            const total = files.reduce((s, f) => s + f.size, 0);
            if (total > MAX_TOTAL_SIZE) {
                alert('图片总大小不能超过 40MB');
                fileInput.value = '';
                return;
            }

            pendingFiles = files;
            updateSelectedCount(files.length);

            // 先打开个性化设置弹窗，允许用户补充心情/同行人/自定义提示词
            const modal = document.getElementById('uploadModal');
            modal.style.display = 'flex';
        }

        function updateSelectedCount(n) {
            const el = document.getElementById('selectedCount');
            if (el) el.textContent = n > 1 ? `已选择 ${n} 张照片` : '已选择 1 张照片';
        }

        function doUpload(files, extra) {
            if (!files || !files.length) return;
            document.getElementById('loadingOverlay').classList.add('show');

            const formData = new FormData();
            files.forEach(f => formData.append('files', f));
            if (extra) {
                if (extra.mood) formData.append('mood', extra.mood);
                if (extra.companions) formData.append('companions', extra.companions);
                if (extra.weather) formData.append('weather', extra.weather);
                if (extra.tags) formData.append('tags', extra.tags);
                if (extra.custom_prompt) formData.append('custom_prompt', extra.custom_prompt);
            }

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        alert('处理失败：' + data.error);
                        return;
                    }
                    addJournalCard(data);
                    const visitDate = data.created_at || (data.exif_data && data.exif_data.datetime) || new Date().toLocaleDateString('zh-CN');
                    updateMap(data.location, data.exif_data.latitude, data.exif_data.longitude, visitDate);
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('处理失败，请重试');
                })
                .finally(() => {
                    pendingFiles = [];
                    fileInput.value = '';
                    hideLoading();
                });
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('show');
        }

        // ===== 标签选择（chips）=====
        const MOOD_OPTIONS = ['开心', '惬意', '惊喜', '宁静', '浪漫', '兴奋', '治愈', '自由', '放松'];
        const WEATHER_OPTIONS = ['晴天', '阴天', '多云', '雨天', '雪天', '雾天', '大风', '雷雨', '沙尘', '冰雹'];
        const TAG_OPTIONS = ['海边', '灯塔', '治愈系', '古城', '美食', '自然风光', '夜景', '徒步', '亲子', '摄影', '文艺', '小众', '历史', '寺庙', '湖泊'];

        // 构建一个标签选择组（single=true 单选，single=false 多选）
        function createChipGroup(options, initial, single, allowCustom) {
            const container = document.createElement('div');
            container.className = 'chip-group';
            let editable = false;
            let customValue = '';

            const placeholder = document.createElement('span');
            placeholder.className = 'chip-empty';
            placeholder.textContent = '未设置';
            container.appendChild(placeholder);

            const toList = (v) => {
                if (single) return v ? [v] : [];
                if (Array.isArray(v)) return v.map(String).filter(Boolean);
                return v ? String(v).split(/[,，、\s]+/).filter(Boolean) : [];
            };
            const selected = new Set(toList(initial));
            const extraChips = []; // 多选时用户自定义的额外标签 { value, chip }

            function refresh() {
                chips.forEach(c => {
                    const isSel = selected.has(c.textContent);
                    c.classList.toggle('selected', isSel);
                    c.style.display = (editable || isSel) ? '' : 'none';
                });
                extraChips.forEach(ec => {
                    const isSel = selected.has(ec.value);
                    ec.chip.classList.toggle('selected', isSel);
                    ec.chip.style.display = (editable || isSel) ? '' : 'none';
                });
                if (customChip) {
                    customChip.style.display = (editable || (single && customValue)) ? '' : 'none';
                }
                placeholder.style.display = (editable || selected.size > 0 || (single && customValue)) ? 'none' : '';
            }

            const chips = options.map(opt => {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'tag-chip';
                chip.textContent = opt;
                chip.addEventListener('click', () => {
                    if (!editable) return;
                    if (single) {
                        const was = selected.has(opt);
                        selected.clear();
                        customValue = '';
                        if (!was) selected.add(opt);
                        updateCustomChip();
                    } else {
                        if (selected.has(opt)) selected.delete(opt);
                        else selected.add(opt);
                    }
                    refresh();
                });
                container.appendChild(chip);
                return chip;
            });

            // ===== 自定义选项（可自行输入）=====
            let customChip = null;
            let customInput = null;

            function updateCustomChip() {
                if (!customChip) return;
                if (single && customValue) {
                    customChip.textContent = '自定义：' + customValue;
                    customChip.classList.add('selected');
                } else {
                    customChip.textContent = '自定义';
                    customChip.classList.remove('selected');
                }
            }

            function commitCustom() {
                const v = customInput.value.trim();
                customInput.value = '';
                customInput.style.display = 'none';
                if (!v) {
                    if (single) { customValue = ''; updateCustomChip(); }
                    return;
                }
                if (single) {
                    customValue = v;
                    selected.clear();
                } else {
                    if (!selected.has(v)) {
                        selected.add(v);
                        addExtraChip(v);
                    }
                }
                updateCustomChip();
                refresh();
            }

            function showCustomInput() {
                customInput.style.display = 'inline-block';
                customInput.focus();
            }

            function addExtraChip(v) {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'tag-chip';
                chip.textContent = v;
                chip.addEventListener('click', () => {
                    if (!editable) return;
                    if (selected.has(v)) selected.delete(v);
                    else selected.add(v);
                    refresh();
                });
                container.insertBefore(chip, customChip);
                extraChips.push({ value: v, chip });
                refresh();
            }

            function clearExtraChips() {
                extraChips.forEach(ec => ec.chip.remove());
                extraChips.length = 0;
            }

            function applyValue(v) {
                selected.clear();
                customValue = '';
                clearExtraChips();
                if (single) {
                    const list = toList(v);
                    if (list.length) {
                        if (options.includes(list[0])) selected.add(list[0]);
                        else customValue = list[0];
                    }
                } else {
                    toList(v).forEach(x => selected.add(x));
                    [...selected].filter(x => !options.includes(x)).forEach(x => addExtraChip(x));
                }
                updateCustomChip();
                refresh();
            }

            if (allowCustom) {
                customChip = document.createElement('button');
                customChip.type = 'button';
                customChip.className = 'tag-chip';
                customChip.textContent = '自定义';
                customChip.addEventListener('click', () => {
                    if (!editable) return;
                    if (single) {
                        selected.clear();
                        customValue = '';
                        updateCustomChip();
                        refresh();
                        showCustomInput();
                    } else {
                        showCustomInput();
                    }
                });
                container.appendChild(customChip);

                customInput = document.createElement('input');
                customInput.type = 'text';
                customInput.className = 'custom-tag-input';
                customInput.placeholder = single ? '输入自定义内容' : '输入标签后回车';
                customInput.style.display = 'none';
                customInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); commitCustom(); }
                });
                customInput.addEventListener('blur', commitCustom);
                container.appendChild(customInput);
            }

            refresh();

            return {
                el: container,
                getValue: () => {
                    if (single) return customValue || ([...selected][0] || '');
                    const ordered = options.filter(o => selected.has(o));
                    const extra = [...selected].filter(v => !options.includes(v));
                    return ordered.concat(extra).join(',');
                },
                setEditable: (e) => { editable = e; container.classList.toggle('chip-readonly', !e); refresh(); },
                setValue: (v) => applyValue(v),
                reset: () => applyValue(initial)
            };
        }

        // ===== 上传个性化设置弹窗 =====
        const uploadModal = document.getElementById('uploadModal');

        // 上传弹窗的标签选择组（心情/天气单选，标签多选）
        let moodChips = createChipGroup(MOOD_OPTIONS, '', true, true);
        moodChips.setEditable(true);
        document.getElementById('moodGroup').appendChild(moodChips.el);

        let weatherChips = createChipGroup(WEATHER_OPTIONS, '', true, true);
        weatherChips.setEditable(true);
        document.getElementById('weatherGroup').appendChild(weatherChips.el);

        let tagsChips = createChipGroup(TAG_OPTIONS, [], false, true);
        tagsChips.setEditable(true);
        document.getElementById('tagsGroup').appendChild(tagsChips.el);

        function closeUploadModal() {
            uploadModal.style.display = 'none';
            pendingFiles = [];
            fileInput.value = '';
        }

        document.getElementById('uploadModalClose').addEventListener('click', closeUploadModal);
        uploadModal.addEventListener('click', (e) => {
            if (e.target === uploadModal) closeUploadModal();
        });

        document.getElementById('skipGenerateBtn').addEventListener('click', () => {
            const files = pendingFiles;
            closeUploadModal();
            if (files && files.length) doUpload(files, null);
        });

        document.getElementById('confirmGenerateBtn').addEventListener('click', () => {
            const extra = {
                mood: moodChips.getValue(),
                companions: document.getElementById('companionInput').value.trim(),
                weather: weatherChips.getValue(),
                tags: tagsChips.getValue(),
                custom_prompt: document.getElementById('customPromptInput').value.trim()
            };
            const files = pendingFiles;
            // 清空输入
            moodChips.reset();
            weatherChips.reset();
            tagsChips.reset();
            document.getElementById('companionInput').value = '';
            document.getElementById('customPromptInput').value = '';
            closeUploadModal();
            if (files && files.length) doUpload(files, extra);
        });

        // ===== 手账卡片管理 =====
        const journalList = document.getElementById('journalList');
        const emptyState = document.getElementById('emptyState');
        let journalCount = 0;

        // 存储所有手账数据
        let allJournals = [];

        // 从图片中提取主色调
        function getImageDominantColor(imageUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = imageUrl;

                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    // 缩小图片以提高性能
                    canvas.width = 32;
                    canvas.height = 32;
                    ctx.drawImage(img, 0, 0, 32, 32);

                    const imageData = ctx.getImageData(0, 0, 32, 32);
                    const data = imageData.data;
                    const colorMap = {};

                    // 统计颜色出现次数
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        const a = data[i + 3];

                        // 忽略透明像素
                        if (a > 128) {
                            const color = `${r},${g},${b}`;
                            colorMap[color] = (colorMap[color] || 0) + 1;
                        }
                    }

                    // 找到出现次数最多的颜色
                    let maxCount = 0;
                    let dominantColor = '139, 119, 101'; // 默认颜色

                    for (const color in colorMap) {
                        if (colorMap[color] > maxCount) {
                            maxCount = colorMap[color];
                            dominantColor = color;
                        }
                    }

                    resolve(dominantColor);
                };

                img.onerror = function () {
                    resolve('139, 119, 101'); // 错误时使用默认颜色
                };
            });
        }

        function buildJournalCard(data) {
            const card = document.createElement('div');
            card.className = 'journal-card';
            card.style.animationDelay = `${journalCount * 0.1}s`;
            journalCount++;

            const dateStr = formatDateCN(data.created_at || (data.exif_data && data.exif_data.datetime) || new Date().toLocaleDateString('zh-CN'));
            const locationText = data.location || '未知地点';
            const tags = (data.tags || []).slice(0, 3);
            const title = ((data.journal || '').split('\n')[0] || '').trim();
            const imageCount = (data.images && data.images.length) || 1;

            card.innerHTML = `
                <div class="journal-cover-wrap">
                    <img class="journal-cover" src="/static/uploads/${data.filename}" alt="旅行照片">
                    ${imageCount > 1 ? `<span class="journal-count-badge">${imageCount}张</span>` : ''}
                </div>
                <div class="journal-info">
                    <div class="journal-date">${dateStr}</div>
                    <div class="journal-location">
                        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
                        ${locationText}
                    </div>
                    <h3 class="journal-title" style="margin: 8px 0 0; font-family: var(--font-display); font-size: 1rem; font-weight: 600; color: var(--color-text);">${title}</h3>
                    ${tags.length ? `<div class="journal-tags" style="margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px;">${tags.map(t => `<span style="font-size:0.7rem; color: var(--color-terracotta); background: var(--color-blush); border-radius: 10px; padding: 1px 8px;">${t}</span>`).join('')}</div>` : ''}
                </div>
            `;

            card.addEventListener('click', () => showJournalDetail(data));
            return card;
        }

        function appendJournalCard(data, prepend = true) {
            emptyState.style.display = 'none';
            const card = buildJournalCard(data);

        function formatDateCN(dateStr) {
            // 把 "2026:08:13 12:19:26" / "2026-08-13 12:19:26" / "2026/08/13"
            // 统一格式化为 "2026年8月13日 12:19:26"（无时间时只显示日期）
            if (!dateStr) return '';
            const m = String(dateStr).match(/(\d{4})[:\-/](\d{1,2})[:\-/](\d{1,2})(?:\s+(\d{1,2}):(\d{2}):(\d{2}))?/);
            if (!m) return String(dateStr);
            let result = `${m[1]}年${parseInt(m[2], 10)}月${parseInt(m[3], 10)}日`;
            if (m[4] !== undefined) {
                result += ` ${m[4]}:${m[5]}:${m[6]}`;
            }
            return result;
        }

        function parseDateKey(dateStr) {
            // 从 "2026:08:13 12:19:26" / "2026-08-13 12:19:26" / "2026年8月13日 ..." 提取 "YYYY-MM-DD"
            if (!dateStr) return null;
            const m = String(dateStr).match(/(\d{4})[年:\-/](\d{1,2})[月:\-/](\d{1,2})/);
            if (!m) return null;
            return `${m[1]}-${String(parseInt(m[2], 10)).padStart(2, '0')}-${String(parseInt(m[3], 10)).padStart(2, '0')}`;
        }

        function updateJournal(journalId, updates, modal, chips) {
            fetch(`/journals/${journalId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updates)
            })
                .then(response => response.json())

                        alert('修改失败：' + data.error);
                        return;
                    }

                    const journalEl = modal.querySelector('.modal-journal');
                    const locationTextEl = modal.querySelector('.modal-location-text');
                    const dateEl = modal.querySelector('.modal-date');

                    if (titleEl) titleEl.textContent = newLines[0] || '';
                    if (journalEl) journalEl.innerText = newLines.slice(1).join('\n');
                    if (locationTextEl) locationTextEl.textContent = data.location || '未知地点';

                    chips.weather.setValue(data.weather);
                    chips.tags.setValue(data.tags || []);

                    modal.querySelectorAll('.editable-field').forEach(el => {

                        el.classList.remove('editing');

                        editBtn.querySelector('span:first-child').textContent = '修改帖子';

        function deleteJournal(journalId, modal) {

                        // 移除模态框

                        // 重新加载手账列表
                        loadJournals();

                        initMap();
                    } else {
                        alert('删除失败：' + (data.error || '未知错误'));
                    }

                .catch(error => {
                    console.error('删除失败:', error);
                    alert('删除失败，请重试');

        const searchKeyword = document.getElementById('searchKeyword');
        const searchLocation = document.getElementById('searchLocation');
        const searchMood = document.getElementById('searchMood');
        const searchTag = document.getElementById('searchTag');
        const searchMonth = document.getElementById('searchMonth');

        function applyFilters() {
            const kw = searchKeyword.value.trim().toLowerCase();
            const loc = searchLocation.value.trim();
            const mood = searchMood.value.trim();
            const tag = searchTag.value.trim();
            const month = searchMonth.value;

            const filtered = allJournals.filter(data => {
                const journal = data.journal || '';
                if (kw && !journal.toLowerCase().includes(kw)) return false;
                if (loc && !(data.location || '').includes(loc)) return false;
                if (mood && !(data.mood || '').includes(mood)) return false;
                if (tag) {
                    const tags = data.tags || [];
                    if (!tags.some(t => t.includes(tag))) return false;
                }
                if (month) {
                    const raw = (data.created_at || '').replace(/[:./]/g, '-');
                    if (!raw.startsWith(month)) return false;
                }
                return true;
            });

            renderJournalList(filtered);
        }

            el.addEventListener('input', applyFilters);
        });

                return `<button type="button" class="${cls}" data-month="${ym}">${name}</button>`;

            monthPickerLabel.textContent = searchMonth.value || '全部月份';
