            monthPickerTrigger.classList.add('open');
        }

        function closeMonthPicker() {
            monthPickerDropdown.classList.remove('open');
            monthPickerTrigger.classList.remove('open');
        }

        monthPickerTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            if (monthPickerDropdown.classList.contains('open')) {
                closeMonthPicker();
            } else {
                openMonthPicker();
            }
        });

        monthPickerPrevYear.addEventListener('click', () => {
            monthPickerViewYear -= 1;
            renderMonthGrid();
        });

        monthPickerNextYear.addEventListener('click', () => {
            monthPickerViewYear += 1;
            renderMonthGrid();
        });

        monthPickerGrid.addEventListener('click', (e) => {
            const btn = e.target.closest('.month-picker-month');
            if (!btn) return;
            searchMonth.value = btn.dataset.month;
            updateMonthLabel();
            closeMonthPicker();
            applyFilters();
        });

        monthPickerClear.addEventListener('click', () => {
            searchMonth.value = '';
            updateMonthLabel();
            closeMonthPicker();
            applyFilters();
        });

        document.addEventListener('click', (e) => {
            if (!monthPicker.contains(e.target)) {
                closeMonthPicker();
            }
        });

        // 初始化
        updateMonthLabel();
        renderMonthGrid();

        // initMap moved to map.js
    </script>
    <script src="/static/map.js"></script>

    <!-- 樱花飘落效果 -->
    <script>
        function createCherryBlossom() {
            const blossom = document.createElement('div');
            blossom.className = 'cherry-blossom';

            // 随机大小
            const size = Math.random() * 8 + 4;
            blossom.style.width = `${size}px`;
            blossom.style.height = `${size}px`;

            // 随机位置
            blossom.style.left = `${Math.random() * 100}%`;
            blossom.style.top = '-20px';

            // 随机动画延迟和持续时间
            const delay = Math.random() * 20;
            const duration = Math.random() * 10 + 15;
            blossom.style.animationDelay = `${delay}s`;
            blossom.style.animationDuration = `${duration}s`;

            // 随机旋转
            blossom.style.transform = `rotate(${Math.random() * 360}deg)`;

            // 确保樱花在正确的层级
            blossom.style.zIndex = '0';

            document.body.appendChild(blossom);

            // 移除元素
            setTimeout(() => {
                if (blossom.parentNode) {
                    blossom.parentNode.removeChild(blossom);
                }
            }, (duration + delay) * 1000);
        }

        // 加载所有手账数据
        function loadJournals() {
            // 清空已访问省份
            if (typeof clearVisitedProvinces === 'function') {
                clearVisitedProvinces();
            }

            // 清空日历标记，避免残留
            journalDates.clear();

            fetch('/journals', { cache: 'no-cache' })
                .then(response => {
                    if (response.status === 401) {
                        window.location.href = '/login';
                        return null;
                    }
                    return response.json();
                })
                .then(data => {
                    if (!data) return;
                    console.log('Loaded journals:', data);
                    // 清空现有手账
                    journalList.innerHTML = '';
                    journalCount = 0;
                    allJournals = [];
                    journalDates.clear();

                    if (data && data.length > 0) {
                        // 倒序显示，最新的在前面
                        data.reverse().forEach(journalData => {
                            allJournals.push(journalData);
                            // 更新地图标记
                            const visitDate = journalData.created_at || (journalData.exif_data && journalData.exif_data.datetime) || new Date().toLocaleDateString('zh-CN');
                            updateMap(journalData.location, journalData.exif_data?.latitude, journalData.exif_data?.longitude, visitDate);

                            // 日历标记
                            const dateSource = journalData.created_at || (journalData.exif_data && journalData.exif_data.datetime);
                            const dateKey = parseDateKey(dateSource);
                            if (dateKey) {
                                journalDates.add(dateKey);
                            }
                        });
                    }
                    renderCalendar();
                    // 按当前筛选条件渲染列表
                    applyFilters();
                })
                .catch(error => {
                    console.error('Error loading journals:', error);
                });
        }

        // ===== 登录校验与用户栏 =====
        async function checkAuth() {
            try {
                const res = await fetch('/api/me', { cache: 'no-cache' });
                const data = await res.json();
                if (!data.logged_in) {
                    window.location.href = '/login';
                    return false;
                }
                document.getElementById('userNameText').textContent = data.username || '用户';
                document.getElementById('userBar').style.display = 'flex';
                return true;
            } catch (err) {
                window.location.href = '/login';
                return false;
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await fetch('/api/logout', { method: 'POST' });
            } catch (err) {
                // 忽略网络错误，仍跳转到登录页
            }
            window.location.href = '/login';
        });

        // 页面加载完成后初始化
        window.addEventListener('load', async function () {
            // 先校验登录状态，未登录跳转登录页
            const authed = await checkAuth();
            if (!authed) return;

            // 加载手账数据
            loadJournals();

            // 初始创建一些樱花
            for (let i = 0; i < 15; i++) {
                setTimeout(createCherryBlossom, i * 300);
            }

            // 定期创建樱花
            setInterval(createCherryBlossom, 600);
        });
    </script>
</body>
